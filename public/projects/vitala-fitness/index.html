function programsPage(){const d=t();let arr=d.programs;if(programFilter!=='all'){const idx=programFilter==='strength'?0:programFilter==='mind'?1:2;arr=[d.programs[idx]]}return `<div class="page">${pageHero(d.programPageTitle,d.programPageDesc,d.nav.programs)}<section class="content-section"><div class="container"><div class="filter-row">${[['all',d.filterAll],['strength',d.filterStrength],['mind',d.filterMind],['cardio',d.filterCardio]].map(x=>`<button class="filter-pill ${programFilter===x[0]?'active':''}" data-filter="${x[0]}">${x[1]}</button>`).join('')}</div><div class="cards-3">${arr.map(imageCard).join('')}</div><div class="cta-panel" style="margin-top:50px"><div><span class="eyebrow">START WHERE YOU ARE</span><h2>${d.ctaTitle}</h2><p>${d.ctaDesc}</p></div><button class="btn btn-primary" data-route="register">${d.join} ↗</button></div></div></section>${headerFooter()}</div>`}
function coachesPage(){const d=t();return `<div class="page">${pageHero(d.coachesPageTitle,d.coachesPageDesc,d.nav.coaches)}<section class="content-section"><div class="container"><div class="coach-large-grid">${d.coaches.map(coachCard).join('')}</div><div class="cta-panel" style="margin-top:45px"><div><span class="eyebrow">COACHING THAT FITS YOU</span><h2>${d.featureTitle}</h2><p>${d.featureDesc}</p></div><button class="btn btn-primary" data-route="contact">${d.nav.contact} ↗</button></div></div></section>${headerFooter()}</div>`}
function pricingPage(){const d=t();return `<div class="page">${pageHero(d.pricingPageTitle,d.pricingPageDesc,d.nav.pricing)}<section class="content-section"><div class="container"><div class="price-grid">${d.plans.map(priceCard).join('')}</div><div class="panel" style="margin-top:28px"><div class="panel-head"><h2>${lang==='ar'?'هل تحتاج إلى مساعدة في الاختيار؟':lang==='en'?'Need help choosing?':'Besoin d’aide pour choisir ?'}</h2><button data-route="contact">${d.nav.contact} ↗</button></div><p style="color:var(--muted);font-size:.86rem;margin:0">${d.featureDesc}</p></div></div></section>${headerFooter()}</div>`}
function aboutPage(){const d=t();return `<div class="page">${pageHero(d.aboutPageTitle,d.aboutPageDesc,d.nav.about)}<section class="content-section"><div class="container about-grid"><div class="about-art reveal"><img src="${img.about}" alt="VITALA fitness community"><div class="about-badge"><span>${d.aboutBadge}</span><strong>✳ 2.4k+</strong></div></div><div class="about-copy reveal"><span class="eyebrow">OUR MINDSET</span><h2>${d.aboutHeading}</h2><p>${d.aboutBody}</p><button class="btn btn-primary" data-route="contact">${d.nav.contact} ↗</button></div></div><div class="container value-grid">${d.values.map((v,i)=>`<article class="value-card reveal"><div class="value-icon">${['↗','✳','♡'][i]}</div><h3>${v[0]}</h3><p>${v[1]}</p></article>`).join('')}</div></section>${headerFooter()}</div>`}
function contactPage(){const d=t();return `<div class="page">${pageHero(d.contactPageTitle,d.contactPageDesc,d.nav.contact)}<section class="content-section"><div class="container contact-grid"><aside class="contact-info"><span class="eyebrow" style="color:var(--accent)">LET’S CONNECT</span><h2>${d.contactInfoTitle}</h2><p>${d.contactInfoDesc}</p><div style="margin-top:24px"><div class="contact-method"><span class="method-icon">⌖</span><div><b>${d.addressLabel}</b><small>${d.addressValue}</small></div></div><div class="contact-method"><span class="method-icon">◷</span><div><b>${d.hoursLabel}</b><small>${d.hoursValue}</small></div></div><div class="contact-method"><span class="method-icon">✉</span><div><b>${d.emailLabel}</b><small>${d.emailValue}</small></div></div></div></aside><form class="contact-form" id="contactForm"><h2 style="margin:0 0 23px;letter-spacing:-.04em">${d.formTitle}</h2><div class="form-grid"><div class="field"><label for="firstName">${d.firstName} *</label><input class="input" id="firstName" name="firstName" required autocomplete="given-name"></div><div class="field"><label for="lastName">${d.lastName} *</label><input class="input" id="lastName" name="lastName" required autocomplete="family-name"></div><div class="field full"><label for="contactEmail">${d.email} *</label><input class="input" id="contactEmail" type="email" required autocomplete="email"></div><div class="field full"><label for="reason">${d.reason}</label><select class="select" id="reason">${d.reasonOptions.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field full"><label for="message">${d.message} *</label><textarea class="textarea" id="message" required></textarea></div><div class="field full"><button class="btn btn-primary" type="submit">${d.send} ↗</button><div id="contactStatus" class="form-status"></div></div></div></form></div></section>${headerFooter()}</div>`}
function authPage(type){const d=t(),register=type==='register';return `<div class="page auth-wrap"><section class="auth-visual"><img src="${img.hero}" alt="" aria-hidden="true"><a class="brand" data-route="home"><span class="brand-mark">✳</span><span>VITALA<small>FITNESS CLUB</small></span></a><div><span class="eyebrow">${register?'YOUR JOURNEY STARTS':'GOOD TO HAVE YOU BACK'}</span><h1>${register?d.registerPageTitle:d.loginPageTitle}</h1><p>${register?d.registerPageDesc:d.loginPageDesc}</p></div><span class="auth-note">✳ &nbsp; ${d.mockDisclaimer}</span></section><section class="auth-panel"><div class="auth-box"><a class="brand" data-route="home"><span class="brand-mark">✳</span><span>VITALA<small>FITNESS CLUB</small></span></a><h2>${register?d.createAccount:d.welcomeBack}</h2><p>${register?d.registerIntro:d.loginIntro}</p><form class="auth-fields" id="authForm" data-auth-type="${type}">${register?`<div class="field"><label for="fullName">${d.fullName}</label><input class="input" id="fullName" name="fullName" autocomplete="name" required></div>`:''}<div class="field"><label for="authEmail">${d.email}</label><input class="input" id="authEmail" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="authPassword">${d.password}</label><div class="password-wrap"><input class="input" id="authPassword" name="password" type="password" minlength="6" autocomplete="${register?'new-password':'current-password'}" required><button type="button" class="password-toggle" data-toggle-password="authPassword">${lang==='ar'?'إظهار':lang==='en'?'Show':'Afficher'}</button></div></div>${register?`<div class="field"><label for="confirmPassword">${d.confirmPassword}</label><div class="password-wrap"><input class="input" id="confirmPassword" name="confirmPassword" type="password" minlength="6" autocomplete="new-password" required><button type="button" class="password-toggle" data-toggle-password="confirmPassword">${lang==='ar'?'إظهار':lang==='en'?'Show':'Afficher'}</button></div></div>`:`<div class="remember-row"><label><input type="checkbox" checked> ${d.remember}</label><a href="#forgot" id="forgotLink">${d.forgot}</a></div>`}<button class="btn btn-primary" type="submit">${register?d.registerSubmit:d.loginSubmit} ↗</button><div class="form-error" id="authError"></div></form><div class="auth-switch">${register?d.hasAccount:d.noAccount} <button data-route="${register?'login':'register'}">${register?d.loginLink:d.signupLink}</button></div><div class="demo-hint">ⓘ ${d.orDemo}</div></div></section></div>`}
function dashboardPage(){const d=t();const name=userName||'Alex';return `<div class="page"><section class="container dashboard-top"><div class="dashboard-header"><div><span class="eyebrow">MEMBER AREA / VITALA</span><h1>${d.dashboardHello} ${escapeHtml(name.split(' ')[0])} ✳</h1><p>${d.dashboardSub}</p></div><button class="btn btn-primary" data-route="programs">${d.bookClass} ↗</button></div><div class="dashboard-stats"><div class="dash-stat"><span>${d.goals}</span><strong>9 / 12</strong><small>↗ 75% ${lang==='ar'?'من الهدف':lang==='en'?'of goal':'de l’objectif'}</small><div class="progress-track"><div class="progress-fill"></div></div></div><div class="dash-stat"><span>${d.membership}</span><strong>${t().plans[1].name}</strong><small>● ${d.memberStatus}</small></div><div class="dash-stat"><span>${d.renewal}</span><strong>24.11.2026</strong><small>● ${lang==='ar'?'لا يوجد إجراء مطلوب':lang==='en'?'No action needed':'Aucune action requise'}</small></div><div class="dash-stat"><span>${lang==='ar'?'الساعات النشطة':lang==='en'?'Active this month':'Actif ce mois'}</span><strong>12.5 h</strong><small>↗ +2.5h</small></div></div><div class="dash-grid"><section class="panel"><div class="panel-head"><h2>${d.upcoming}</h2><button data-route="programs">${d.viewPlanning} ↗</button></div>${d.sessionList.map(s=>`<div class="session-row"><div class="session-date"><small>${s[0]}</small><b>${s[1]}</b></div><div class="session-detail"><b>${s[2]}</b><small>${s[3]}</small></div><span class="status-pill">${lang==='ar'?'محجوز':lang==='en'?'Booked':'Réservé'}</span></div>`).join('')}<button class="btn btn-ghost btn-small" style="margin-top:13px" data-route="programs">+ ${d.bookClass}</button></section><section style="display:grid;gap:18px"><div class="member-card"><small>${d.memberSince}</small><h3>${t().plans[1].name}<br><span style="font-size:.75rem;font-weight:600;color:#bdd0c1">VTL · 0084 2190</span></h3><div class="member-card-bottom"><span>${d.memberStatus}</span><span>✳ VITALA</span></div></div><div class="panel"><div class="panel-head"><h2>${d.quickActions}</h2></div><div style="display:grid;gap:10px"><button class="btn btn-ghost" data-route="programs">◷ &nbsp; ${d.bookClass} ↗</button><button class="btn btn-ghost" data-route="pricing">✳ &nbsp; ${d.viewPlans} ↗</button><button class="btn btn-ghost" data-action="profile">☻ &nbsp; ${d.profile}</button><button class="btn btn-ghost" data-action="logout">↩ &nbsp; ${d.logout}</button></div></div></section></div></section>${headerFooter()}</div>`}
function render(){applyPrefs();renderNav();const views={home,programs:programsPage,coaches:coachesPage,pricing:pricingPage,about:aboutPage,contact:contactPage,login:()=>authPage('login'),register:()=>authPage('register'),dashboard:dashboardPage};app.innerHTML=(views[page]||home)();bindPageEvents();observeReveals();}
function toast(msg){clearTimeout(toastTimer);toastEl.textContent=msg;toastEl.classList.add('show');toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2900)}
function bindPageEvents(){app.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{programFilter=el.dataset.filter;render()}));const af=document.getElementById('authForm');if(af)af.addEventListener('submit',handleAuth);const cf=document.getElementById('contactForm');if(cf)cf.addEventListener('submit',e=>{e.preventDefault();const st=document.getElementById('contactStatus');st.style.display='block';st.textContent=t().successContact;cf.reset();toast(t().successContact)});const nf=document.getElementById('newsletterForm');if(nf)nf.addEventListener('submit',e=>{e.preventDefault();nf.reset();toast(t().successContact||t().subscribe+' ✓')});app.querySelectorAll('[data-toggle-password]').forEach(btn=>btn.addEventListener('click',()=>{const el=document.getElementById(btn.dataset.togglePassword);const show=el.type==='password';el.type=show?'text':'password';btn.textContent=show?(lang==='ar'?'إخفاء':lang==='en'?'Hide':'Masquer'):(lang==='ar'?'إظهار':lang==='en'?'Show':'Afficher')}));const forgot=document.getElementById('forgotLink');if(forgot)forgot.addEventListener('click',e=>{e.preventDefault();toast(lang==='ar'?'استعمل نموذج الاتصال لاستعادة الحساب التجريبي.':lang==='en'?'Use the contact form for demo account recovery.':'Utilise le formulaire de contact pour récupérer le compte de démo.')});}
function handleAuth(e){e.preventDefault();const form=e.currentTarget,fd=new FormData(form),email=String(fd.get('email')||''),password=String(fd.get('password')||''),type=form.dataset.authType,err=document.getElementById('authError');err.style.display='none';if(!/^\S+@\S+\.\S+$/.test(email)||password.length<6){err.textContent=t().authRequired;err.style.display='block';return}if(type==='register'&&password!==String(fd.get('confirmPassword')||'')){err.textContent=t().passwordMismatch;err.style.display='block';return}userName=type==='register'?String(fd.get('fullName')||'Alex'):((email.split('@')[0]||'Alex').replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()));storageSet('vitala-user',userName);toast(type==='register'?t().registerSuccess:t().authSuccess);page='dashboard';render();window.scrollTo({top:0,behavior:'smooth'})}
function observeReveals(){const els=app.querySelectorAll('.reveal');if(!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('visible'));return}const io=new IntersectionObserver(entries=>entries.forEach(en=>{if(en.isIntersecting){en.target.classList.add('visible');io.unobserve(en.target)}}),{threshold:.08});els.forEach(e=>io.observe(e))}
themeBtn.addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';storageSet('vitala-theme',theme);applyPrefs()});langBtn.addEventListener('click',()=>{lang=lang==='fr'?'en':lang==='en'?'ar':'fr';storageSet('vitala-lang',lang);render()});document.getElementById('menuToggle').addEventListener('click',()=>nav.classList.toggle('open'));document.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){if(route.closest('#mainNav'))return;e.preventDefault();go(route.dataset.route)}const act=e.target.closest('[data-action]');if(act){if(act.dataset.action==='logout'){userName='';storageRemove('vitala-user');toast(lang==='ar'?'تم تسجيل الخروج من العرض التجريبي.':lang==='en'?'You have logged out of the demo.':'Déconnexion de la démo réussie.');go('home')}else if(act.dataset.action==='profile'){toast(lang==='ar'?'الملف الشخصي التجريبي':lang==='en'?'Demo profile':'Profil de démonstration')}}});
// Add a lightweight parallax drift to hero decorative shapes, without relying on external libraries.
window.addEventListener('pointermove',e=>{if(page!=='home'||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const hero=document.querySelector('.hero');if(!hero)return;const r=hero.getBoundingClientRect();if(e.clientY<r.top||e.clientY>r.bottom)return;const x=(e.clientX/window.innerWidth-.5)*7,y=(e.clientY/window.innerHeight-.5)*7;const orb=hero.querySelector('.orb.one');if(orb)orb.style.margin=`${y}px ${x}px`;},{passive:true});
applyPrefs();render();
})();
</script>
</body></html>
