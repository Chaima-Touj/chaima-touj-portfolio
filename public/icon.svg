<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="60%" stop-color="#1e0538"/>
      <stop offset="100%" stop-color="#070210"/>
    </radialGradient>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Glowing outer ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#7e22ce" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="16 8"/>

  <!-- Code Logo </> -->
  <g filter="url(#neonGlow)" stroke="url(#neonGradient)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left bracket < -->
    <path d="M 180 185 L 115 256 L 180 327" />
    
    <!-- Slash / -->
    <path d="M 285 160 L 227 352" />
    
    <!-- Right bracket > -->
    <path d="M 332 185 L 397 256 L 332 327" />
  </g>

  <!-- Decorative sparkling stars -->
  <circle cx="130" cy="130" r="4" fill="#f472b6" opacity="0.8"/>
  <circle cx="390" cy="120" r="5" fill="#c084fc" opacity="0.9"/>
  <circle cx="380" cy="390" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="120" cy="380" r="3" fill="#ec4899" opacity="0.8"/>
</svg>
